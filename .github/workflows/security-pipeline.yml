name: Cloud Security Platform CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python Syntax Check
        run: |
          python -m py_compile security/detections/detect.py
          python -m py_compile security/incidents/incident_manager.py
          python -m py_compile security/remediation/remediate.py

      - name: Build Docker Image
        working-directory: application
        run: docker build -t cloud-security-platform-app:ci .
